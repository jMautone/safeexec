services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      SAFEEXEC_DATABASE_URL: postgresql+asyncpg://safeexec:safeexec@db:5432/safeexec
      SAFEEXEC_SANDBOX_WORKDIR_BASE: /var/tmp/safeexec
    volumes:
      # The API orchestrates sibling sandbox containers through the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Per-execution workdirs must be visible to the daemon under the same path.
      - /var/tmp/safeexec:/var/tmp/safeexec
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safeexec
      POSTGRES_PASSWORD: safeexec
      POSTGRES_DB: safeexec
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeexec"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
